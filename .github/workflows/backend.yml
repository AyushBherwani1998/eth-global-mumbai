name: backend

on:
  pull_request:
    paths: ["services/**", "cre/**", "contracts/abis/**", "contracts/script/demo/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["services/**", "cre/**", "contracts/abis/**", "contracts/script/demo/**", ".github/workflows/backend.yml"]

jobs:
  mock-exchange:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mock-exchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: ABIs match contracts/abis
        run: npm run abis:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Every endpoint against an anvil Sepolia fork running the demo deploy (services/api/scripts/integration.sh).
  api-integration:
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: services/api
    env:
      # Repo secret if set, otherwise a public Sepolia RPC. A pinned SEPOLIA_FORK_BLOCK (repo variable) must
      # still be served by that RPC (public nodes prune old state); empty = head - 5.
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
      SEPOLIA_FORK_BLOCK: ${{ vars.SEPOLIA_FORK_BLOCK }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build contracts
        run: forge build
        working-directory: contracts
      - name: Integration tests (anvil fork + demo rehearsal + second live listing)
        run: npm run test:integration
      - name: Logs
        if: failure()
        run: tail -n 80 .integration/*.log

  cre-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cre/listing-policy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Compile to WASM (cre-compile)
        run: bun run build
