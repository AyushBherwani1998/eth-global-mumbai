# CRE project settings (cre CLI >= 1.39). `cre workflow simulate ./listing-policy --target staging-settings`
# reads the RPCs from here; the forwarder used for simulation is the CLI's built-in Sepolia
# MockKeystoneForwarder (0x15fC6ae953E024d975e77382eEeC56A9101f9F88).
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
